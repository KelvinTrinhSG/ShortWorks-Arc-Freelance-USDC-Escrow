  <g fill="#FBC55A"><use href="#star" x="229" y="168" width="14" height="14"/><use href="#star" x="245" y="168" width="14" height="14"/><use href="#star" x="261" y="168" width="14" height="14"/><use href="#star" x="277" y="168" width="14" height="14"/><use href="#star" x="293" y="168" width="14" height="14"/></g>
