    <g fill="#FBC55A"><use href="#star" x="369" y="188" width="12" height="12"/><use href="#star" x="384" y="188" width="12" height="12"/><use href="#star" x="399" y="188" width="12" height="12"/><use href="#star" x="414" y="188" width="12" height="12"/><use href="#star" x="429" y="188" width="12" height="12"/></g>
