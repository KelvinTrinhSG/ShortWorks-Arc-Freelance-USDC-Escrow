    <rect x="96" y="210" width="34" height="14" rx="7" fill="#E6F4EB"/>
    <rect x="134" y="210" width="30" height="14" rx="7" fill="#E6F4EB"/>
  </g>

  <!-- right card -->
  <g transform="rotate(7 402 170)">
