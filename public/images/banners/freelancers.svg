      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity=".12"/>
    </filter>
    <symbol id="star" viewBox="0 0 14 14"><path d="M7 0l2 4.2 4.6.7-3.3 3.2.8 4.6L7 10.5l-4.1 2.2.8-4.6L.4 4.9 5 4.2z"/></symbol>
  </defs>
  <ellipse cx="266" cy="166" rx="228" ry="120" fill="#fff" opacity=".55"/>
  <path d="M470 60l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FBC55A"/>
  <path d="M60 236l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#5BBB7B"/>
  <circle cx="58" cy="80" r="5" fill="#6C8CF5"/>
  <circle cx="478" cy="232" r="4" fill="#F29A76"/>

  <!-- left card -->
