<svg xmlns="http://www.w3.org/2000/svg" width="532" height="300" viewBox="0 0 532 300" fill="none">
  <!-- /services: a phone playing a short video, with rating, price and delivery cards -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity=".12"/>
    </filter>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BD69B"/>
      <stop offset="1" stop-color="#4A9FD8"/>
    </linearGradient>
  </defs>
  <ellipse cx="266" cy="164" rx="226" ry="122" fill="#fff" opacity=".55"/>
  <path d="M96 52l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FBC55A"/>
  <path d="M458 236l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#5BBB7B"/>
  <circle cx="470" cy="118" r="5" fill="#F29A76"/>
  <circle cx="74" cy="214" r="4" fill="#6C8CF5"/>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="203" y="20" width="126" height="252" rx="24" fill="#222"/>
    <rect x="211" y="34" width="110" height="224" rx="16" fill="url(#screen)"/>
    <rect x="248" y="26" width="36" height="5" rx="2.5" fill="#444"/>
  </g>
  <!-- person in the video -->
  <circle cx="266" cy="88" r="20" fill="#fff" opacity=".9"/>
  <path d="M224 200c4-60 22-86 42-86s38 26 42 86z" fill="#fff" opacity=".9"/>
  <!-- play button -->
  <circle cx="266" cy="160" r="20" fill="#5BBB7B"/>
  <path d="M260 150l16 10-16 10z" fill="#fff"/>
  <!-- captions -->
  <rect x="226" y="214" width="80" height="8" rx="4" fill="#fff"/>
  <rect x="238" y="228" width="56" height="8" rx="4" fill="#fff" opacity=".8"/>
  <!-- side actions -->
  <circle cx="306" cy="84" r="7" fill="#fff" opacity=".85"/>
  <circle cx="306" cy="104" r="7" fill="#fff" opacity=".85"/>
  <circle cx="306" cy="124" r="7" fill="#F29A76"/>

  <!-- rating card -->
  <g filter="url(#sh)">
    <rect x="52" y="78" width="132" height="74" rx="14" fill="#fff"/>
  </g>
  <g fill="#FBC55A">
    <path d="M72 96l3 6 6.5.9-4.7 4.6 1.1 6.5-5.9-3.1-5.9 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/>
    <path d="M94 96l3 6 6.5.9-4.7 4.6 1.1 6.5-5.9-3.1-5.9 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/>
    <path d="M116 96l3 6 6.5.9-4.7 4.6 1.1 6.5-5.9-3.1-5.9 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/>
    <path d="M138 96l3 6 6.5.9-4.7 4.6 1.1 6.5-5.9-3.1-5.9 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/>
    <path d="M160 96l3 6 6.5.9-4.7 4.6 1.1 6.5-5.9-3.1-5.9 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/>
  </g>
  <rect x="66" y="124" width="84" height="7" rx="3.5" fill="#222" opacity=".8"/>
  <rect x="66" y="137" width="58" height="6" rx="3" fill="#C9D1CC"/>

  <!-- price card -->
  <g filter="url(#sh)">
    <rect x="352" y="160" width="138" height="70" rx="14" fill="#fff"/>
  </g>
  <circle cx="384" cy="195" r="18" fill="#5BBB7B"/>
  <text x="384" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">$</text>
  <rect x="410" y="184" width="62" height="8" rx="4" fill="#222" opacity=".8"/>
  <rect x="410" y="199" width="44" height="6" rx="3" fill="#C9D1CC"/>

  <!-- delivery badge -->
  <g filter="url(#sh)">
    <circle cx="414" cy="86" r="30" fill="#F29A76"/>
  </g>
  <circle cx="414" cy="86" r="17" fill="none" stroke="#fff" stroke-width="3.5"/>
  <path d="M414 76v11l7 5" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
